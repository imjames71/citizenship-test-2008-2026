<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="🇺🇸 Civics Test 2008">
    <meta name="format-detection" content="telephone=no">
    <title>US Citizenship Civics Test</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --bg-gradient: linear-gradient(145deg, #1e1b4b 0%, #312e81 40%, #1e3a8a 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border-color: #e2e8f0;
            --success: #059669;
            --danger: #ef4444;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #cbd5e1;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(var(--safe-top) + 16px) calc(var(--safe-right) + 16px) calc(var(--safe-bottom) + 20px) calc(var(--safe-left) + 16px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            touch-action: pan-y;
            transition: background 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            padding: 20px 22px 16px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 6px;
        }

        .dark-toggle {
            position: absolute;
            top: 20px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dark-toggle:active {
            transform: scale(0.95);
        }

        .progress-bar-track {
            background: var(--border-color);
            height: 6px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #6366f1, #3b82f6);
            height: 100%;
            transition: width 0.25s ease-out;
        }

        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 8px 12px;
            transition: border-color 0.2s ease;
        }

        .search-bar:focus-within {
            border-color: var(--primary);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 16px;
            font-family: inherit;
        }

        .search-input::placeholder {
            color: var(--text-sub);
        }

        .search-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 13px;
            cursor: pointer;
            padding: 0 4px;
        }

        .filter-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            justify-content: center;
        }

        .filter-btn {
            flex-shrink: 0;
            padding: 6px 9px;
            background: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .filter-btn.active-wrong {
            background: #dc2626;
            border-color: #dc2626;
            color: #ffffff;
        }

        .filter-btn.active-senior {
            background: #1e40af;
            border-color: #1e40af;
            color: #ffffff;
        }

        .filter-btn.active-autoplay {
            background: #059669;
            border-color: #059669;
            color: #ffffff;
            animation: pulsePlay 1.5s infinite ease-in-out;
        }

        @keyframes pulsePlay {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badges-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .question-number {
            background: #ede9fe;
            color: #4338ca;
            padding: 5px 12px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
        }

        .important-badge {
            background: #fee2e2;
            color: #b91c1c;
            padding: 5px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
        }

        .senior-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 5px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            display: none;
        }

        .senior-badge.show {
            display: inline-flex;
        }

        .wrong-badge {
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
            padding: 4px 9px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            display: none;
        }

        .wrong-badge.show {
            display: inline-flex;
        }

        .question-box {
            min-height: 84px;
            display: flex;
            align-items: center;
        }

        .question-text {
            font-size: 20px;
            line-height: 1.45;
            color: #d0d0d0;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }

        body.dark-mode .question-text {
            color: #3d4756;
        }

        .answer-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 18px;
            padding: 18px 20px;
            display: none;
            animation: fadeIn 0.2s ease-out;
        }

        .answer-card.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .answer-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--success);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .answer-content {
            font-size: 12px;
            color: #d0d0d0;
            line-height: 1.6;
            font-weight: 500;
        }

        body.dark-mode .answer-content {
            color: #3d4756;
        }

        .answer-line {
            cursor: pointer;
            padding: 4px 0;
            transition: opacity 0.15s ease;
            user-select: none;
        }

        .answer-line:active {
            opacity: 0.5;
        }

        .note-card {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            color: #92400e;
        }

        body.dark-mode .note-card {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
        }

        body.dark-mode .stat-item-interactive.is-wrong {
            background: rgba(220, 38, 38, 0.3);
        }

        body.dark-mode .stat-item-interactive.is-wrong .stat-val {
            color: #fca5a5;
        }

        body.dark-mode .stat-item-interactive.is-wrong .stat-lbl {
            color: #f1f5f9;
        }

        body.dark-mode .stat-item-interactive.is-wrong .stat-subhint {
            color: #e2e8f0;
        }

        body.dark-mode .wrong-badge {
            background: rgba(220, 38, 38, 0.2);
            color: #fca5a5;
            border-color: rgba(220, 38, 38, 0.3);
        }

        body.dark-mode .important-badge {
            background: rgba(185, 28, 28, 0.2);
            color: #fca5a5;
        }

        body.dark-mode .senior-badge {
            background: rgba(30, 64, 175, 0.2);
            color: #93c5fd;
        }

        body.dark-mode .question-number {
            background: rgba(79, 70, 229, 0.3);
            color: #c7d2fe;
        }

        .empty-state {
            text-align: center;
            padding: 40px 10px;
            color: var(--text-sub);
        }

        .swipe-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-sub);
            margin-top: -6px;
        }

        .main-controls {
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 14px 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: all 0.12s ease;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-nav {
            background: var(--border-color);
            color: var(--text-sub);
        }

        .btn-reveal {
            background: var(--success);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
        }

        .btn-reveal.playing {
            background: #dc2626;
        }

        .pause-container {
            margin-top: 10px;
            display: flex;
            justify-content: center;
        }

        .btn-pause {
            background: #f59e0b;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
            min-width: 200px;
        }

        .btn-pause.paused {
            background: #059669;
        }

        .stats-display {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            margin-top: 4px;
        }

        .stat-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
        }

        .stat-lbl {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 3px;
            font-weight: 600;
        }

        .stat-item-interactive {
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 14px;
            background: var(--border-color);
            transition: all 0.2s;
        }

        .stat-item-interactive:active {
            transform: scale(0.94);
        }

        .stat-item-interactive.is-wrong {
            background: #fee2e2;
        }

        .stat-item-interactive.is-wrong .stat-val {
            color: #dc2626;
        }

        .stat-subhint {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 1px;
        }

        .toast {
            position: fixed;
            bottom: calc(var(--safe-bottom) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease-out;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 검색 결과 */
        .search-results {
            max-height: 200px;
            overflow-y: auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-top: -10px;
            display: none;
        }

        .search-results.show {
            display: block;
        }

        .search-result-item {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .search-result-item:hover {
            background: rgba(79, 70, 229, 0.05);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-q {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .search-result-a {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* 음성 답변 섹션 */
        .voice-answer-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 6px;
        }

        .btn-mic {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .btn-mic.listening {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            animation: pulse 1.5s infinite;
        }

        .btn-mic:disabled {
            background: var(--border-color);
            color: var(--text-sub);
            box-shadow: none;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
                transform: scale(1.02);
            }
        }

        .recognition-status {
            text-align: center;
            font-size: 14px;
            color: var(--text-sub);
            min-height: 24px;
            font-style: italic;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .recognition-status.active {
            color: #ef4444;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.05);
        }

        body.dark-mode .recognition-status.active {
            background: rgba(239, 68, 68, 0.15);
        }

        .answer-result {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .answer-result.show {
            display: block;
        }

        .answer-result.correct {
            border-color: #22c55e;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(22, 163, 74, 0.05));
        }

        .answer-result.incorrect {
            border-color: #ef4444;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.05));
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-header.correct {
            color: #22c55e;
        }

        .result-header.incorrect {
            color: #ef4444;
        }

        .result-text {
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .result-label {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
            margin-top: 4px;
        }

        body.dark-mode .answer-result.correct {
            background: rgba(34, 197, 94, 0.15);
        }

        body.dark-mode .answer-result.incorrect {
            background: rgba(239, 68, 68, 0.15);
        }
    </style>
</head>
<body>
    <div class="container" id="cardContainer">
        <header class="header">
            <button class="dark-toggle" id="darkToggle">🌙</button>
            <h1>🇺🇸 U.S. Citizenship Civics</h1>
            <p>2008년형 · Northbrook, IL · 2026년 기준</p>
        </header>

        <div class="progress-bar-track">
            <div class="progress-fill" id="progressBar" style="width: 1%;"></div>
        </div>

        <div class="content">
            <!-- 검색 바 -->
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="질문 검색 (예: President, Constitution)">
                <button class="search-btn" id="searchBtn">🔍</button>
            </div>

            <!-- 검색 결과 -->
            <div class="search-results" id="searchResults"></div>

            <!-- 컨트롤 버튼 영역 -->
            <div class="filter-row">
                <button class="filter-btn" id="randomBtn">🔀 랜덤</button>
                <button class="filter-btn" id="importantBtn">⭐ 핵심</button>
                <button class="filter-btn" id="wrongOnlyBtn">❌ 오답</button>
                <button class="filter-btn" id="seniorOnlyBtn">👴 65세</button>
                <button class="filter-btn" id="autoplayBtn">▶️ 자동</button>
            </div>

            <!-- 질문과 답변 표시 영역 -->
            <div class="meta-row">
                <div class="badges-wrap">
                    <span class="question-number" id="questionNumber">Q.1</span>
                    <span class="important-badge" id="importantBadge">자주 출제</span>
                    <span class="senior-badge" id="seniorBadge">65세</span>
                    <span class="wrong-badge" id="wrongBadge">❌ 오답</span>
                </div>
            </div>

            <div class="question-box">
                <div class="question-text" id="questionText">What is the supreme law of the land?</div>
            </div>

            <p class="swipe-hint">💡 Swipe left/right or Tap to replay</p>

            <!-- 정답 듣기 버튼 -->
            <div class="main-controls">
                <button class="btn btn-nav" id="prevBtn" disabled>◀ 이전</button>
                <button class="btn btn-reveal" id="answerBtn">🔊 정답 듣기</button>
                <button class="btn btn-nav" id="nextBtn">다음 ▶</button>
            </div>

            <!-- 음성 답변 버튼 -->
            <div class="voice-answer-section">
                <button class="btn btn-mic" id="micBtn">🎤 음성으로 답하기</button>
                <div class="recognition-status" id="recognitionStatus"></div>
                <div class="answer-result" id="answerResult"></div>
            </div>

            <!-- 통계 표시 영역 -->
            <div class="stats-display">
                <div class="stat-item">
                    <div class="stat-val" id="statTotal">100</div>
                    <div class="stat-lbl">총 문항수</div>
                </div>
                <div class="stat-item stat-item-interactive" id="wrongToggleBtn">
                    <div class="stat-val" id="statWrong">0</div>
                    <div class="stat-lbl">오답</div>
                    <div class="stat-subhint">Tap to toggle</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val" id="statCurrent">1</div>
                    <div class="stat-lbl">현재 문항</div>
                </div>
            </div>

            <!-- Pause 버튼 (자동 재생 중에만 표시) -->
            <div class="pause-container" id="pauseContainer" style="display: none;">
                <button class="btn btn-pause" id="pauseBtn">⏸ Pause</button>
            </div>

            <div id="noteContainer"></div>

            <div class="answer-card" id="answerCard">
                <div class="answer-label">
                    <span>✓ Answer</span>
                </div>
                <div class="answer-content" id="answerText">the Constitution</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toastMsg"></div>

    <script>
        var questionsData = [
            { id: 1, question: "What is the supreme law of the land?", answer: "the Constitution", important: true },
            { id: 2, question: "What does the Constitution do?", answer: "• sets up the government<br>• defines the government<br>• protects basic rights of Americans", important: true },
            { id: 3, question: "The idea of self-government is in the first three words of the Constitution. What are these words?", answer: "We the People", important: true },
            { id: 4, question: "What is an amendment?", answer: "• a change (to the Constitution)<br>• an addition (to the Constitution)", important: false },
            { id: 5, question: "What do we call the first ten amendments to the Constitution?", answer: "the Bill of Rights", important: true },
            { id: 6, question: "What is one right or freedom from the First Amendment?", answer: "• speech<br>• religion", important: true, senior: true },
            { id: 7, question: "How many amendments does the Constitution have?", answer: "27", important: false },
            { id: 8, question: "What did the Declaration of Independence do?", answer: "• announced our independence (from Great Britain)", important: true },
            { id: 9, question: "What are two rights in the Declaration of Independence?", answer: "• life<br>• liberty<br>• pursuit of happiness", important: true },
            { id: 10, question: "What is freedom of religion?", answer: "You can practice any religion, or not practice a religion.", important: false },
            { id: 11, question: "What is the economic system in the United States?", answer: "• capitalist economy<br>• market economy", important: false, senior: true },

        // 무음 오디오로 백그라운드에서 계속 실행 유지 (화면 꺼짐 방지)
        function createKeepAliveAudio() {
            if (keepAliveAudio) return;

            try {
                keepAliveAudio = new Audio();
                // 10초 무음 데이터 URI (AAC)
                keepAliveAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                keepAliveAudio.loop = true;
                keepAliveAudio.volume = 0.01; // 거의 무음
                keepAliveAudio.preload = 'auto';
            } catch (e) {
                console.error('Keep-alive audio creation failed:', e);
            }
        }

        function startKeepAliveAudio() {
            createKeepAliveAudio();
            if (keepAliveAudio) {
                try {

                    if (playPromise !== undefined) {
                        playPromise.then(function() {

        function playSingleUtterance(cleanText, onEndCallback) {
            try {
                var utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-US';
                utterance.rate = ttsRate;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                try {
                    var voices = window.speechSynthesis.getVoices();
                    var preferredVoice = null;

                    // 고품질 여성 음성 우선 순위 (iPhone에서 최적화)
                    var preferredNames = [
                        'Samantha',              // iOS 최고 품질 여성 음성
                        'Samantha (Enhanced)',   // iOS 향상된 버전
                        'Ava',                   // iOS 자연스러운 여성 음성
                        'Ava (Enhanced)',
                        'Google US English',     // Android
                        'Karen',                 // iOS 호주 영어
                        'Microsoft Zira',        // Windows
                        'en-US'                  // 기본
                    ];

                    if (voices && voices.length > 0) {
                        // 1순위: 이름으로 선호 음성 찾기
                        for (var p = 0; p < preferredNames.length; p++) {
                            for (var i = 0; i < voices.length; i++) {
                                if (voices[i].name.indexOf(preferredNames[p]) !== -1 &&
                                    (voices[i].lang === 'en-US' || voices[i].lang === 'en_US')) {
                                    preferredVoice = voices[i];
                                    break;
                                }
                            }
                            if (preferredVoice) break;
                        }

                        // 2순위: en-US 음성 중 아무거나
                        if (!preferredVoice) {
                            for (var i = 0; i < voices.length; i++) {
                                if (voices[i].lang === 'en-US' || voices[i].lang === 'en_US') {
                                    preferredVoice = voices[i];
                                    break;
                                }
                            }
                        }

                        if (preferredVoice) {
                            utterance.voice = preferredVoice;
                        }
                    }
                } catch (vErr) {}

                // iOS에서 안정적인 동작을 위한 추가 처리
                var estimatedDuration = cleanText.length * 60; // 대략적인 재생 시간 (ms)
                var hasEnded = false;

                utterance.onend = function() {
                    if (hasEnded) return;
                    hasEnded = true;
                    // iOS에서 안정성을 위해 약간의 추가 대기
                    setTimeout(function() {
                        if (typeof onEndCallback === 'function') onEndCallback();
                    }, 300);
                };

                utterance.onerror = function() {
                    if (hasEnded) return;
                    hasEnded = true;
                    if (typeof onEndCallback === 'function') onEndCallback();
                };

                // iOS에서 음성이 실제로 끝났는지 확인하는 안전장치
                setTimeout(function() {
                    if (!hasEnded && !window.speechSynthesis.speaking) {
                        hasEnded = true;
                        if (typeof onEndCallback === 'function') onEndCallback();
                    }
                }, estimatedDuration + 1000);

                window.speechSynthesis.speak(utterance);
            } catch (e) {
                if (typeof onEndCallback === 'function') onEndCallback();
            }
        }

        // 연도를 음성으로 자연스럽게 읽도록 변환
        function convertYearsToSpeech(text) {
            // 2001 → two thousand one
            text = text.replace(/\b2001\b/g, 'two thousand one');

            // 1956 → nineteen fifty-six
            text = text.replace(/\b1956\b/g, 'nineteen fifty-six');

            // 1929 → nineteen twenty-nine
            text = text.replace(/\b1929\b/g, 'nineteen twenty-nine');

            // 1920 → nineteen twenty
            text = text.replace(/\b1920\b/g, 'nineteen twenty');

            // 1870 → eighteen seventy
            text = text.replace(/\b1870\b/g, 'eighteen seventy');

            // 1812 → eighteen twelve
            text = text.replace(/\b1812\b/g, 'eighteen twelve');

            // 1803 → eighteen oh three
            text = text.replace(/\b1803\b/g, 'eighteen oh three');

            // 1787 → seventeen eighty-seven
            text = text.replace(/\b1787\b/g, 'seventeen eighty-seven');

            // 1776 → seventeen seventy-six
            text = text.replace(/\b1776\b/g, 'seventeen seventy-six');

            // 1900s → the nineteen hundreds
            text = text.replace(/\b1900s\b/g, 'the nineteen hundreds');

            // 1800s → the eighteen hundreds
            text = text.replace(/\b1800s\b/g, 'the eighteen hundreds');

            return text;
        }

        function speakQuestion(rawText, callback) {
            if (!('speechSynthesis' in window)) {
                showToast('음성 합성을 지원하지 않습니다.');
                if (callback) callback();
                return;
            }

            stopAllSpeech();

            var cleanText = rawText.replace(/<[^>]*>?/gm, ' ')
                                   .replace(/[•\[\]\(\)]/g, ' ')
                                   .replace(/\s+/g, ' ')
                                   .trim();

            // 연도 변환 적용
            cleanText = convertYearsToSpeech(cleanText);

            if (!cleanText) {
                if (callback) callback();
                return;
            }

            playSingleUtterance(cleanText, function() {
                // iOS 안정성을 위해 추가 대기
                setTimeout(function() {
                    if (callback) callback();
                }, 200);
            });
        }

        function speakAnswerLines(rawHtml, callback) {
            if (!('speechSynthesis' in window)) {
                showToast('음성 합성을 지원하지 않습니다.');
                if (callback) callback();
                return;
            }

            if (isSpeakingAnswer) {
                stopAllSpeech();
                showToast('정답 읽기를 중단했습니다.');
                if (callback) callback();
                return;
            }

            stopAllSpeech();

            var rawLines = rawHtml.split(/<br\s*\/?>|\n/i);
            var cleanLines = [];

            for (var i = 0; i < rawLines.length; i++) {
                var line = rawLines[i].replace(/<[^>]*>?/gm, ' ')
                                      .replace(/[•\[\]\(\)]/g, ' ')
                                      .replace(/\s+/g, ' ')
                                      .trim();
                if (line.length > 0) {
                    // 연도 변환 적용
                    line = convertYearsToSpeech(line);
                    cleanLines.push(line);
                }
            }

            if (cleanLines.length === 0) {
                if (callback) callback();
                return;
            }

            isSpeakingAnswer = true;
            var answerBtnEl = document.getElementById('answerBtn');

            function getOrdinal(n) {
                var s = ["th", "st", "nd", "rd"];
                var v = n % 100;
                return n + (s[(v - 20) % 10] || s[v] || s[0]);
            }

            if (answerBtnEl) {
                answerBtnEl.innerHTML = '⏹ Stop (' + cleanLines.length + ' lines)';
                answerBtnEl.classList.add('playing');
            }

            var currentLineIndex = 0;

            function playNextLine() {
                if (!isSpeakingAnswer) {
                    if (callback) callback();
                    return;
                }

                if (currentLineIndex >= cleanLines.length) {
                    stopAllSpeech();
                    if (callback) callback();
                    return;
                }

                var textToRead = cleanLines[currentLineIndex];

                if (answerBtnEl) {
                    answerBtnEl.innerHTML = '⏹ ' + getOrdinal(currentLineIndex + 1) + ' of ' + cleanLines.length;
                }

                playSingleUtterance(textToRead, function() {
                    currentLineIndex++;
                    if (currentLineIndex < cleanLines.length) {
                        // iOS 안정성을 위해 대기 시간 증가
                        ttsSequenceTimer = setTimeout(function() {
                            playNextLine();
                        }, 1500);
                    } else {
                        stopAllSpeech();
                        // iOS 안정성을 위해 추가 대기
                        setTimeout(function() {
                            if (callback) callback();
                        }, 300);
                    }
                });
            }

            playNextLine();
        }

        function startAutoPlay() {

                        speakAnswerLines(current.answer, function() {
                            if (!isAutoPlayMode || isPaused) return;

                            // 4. 2초 대기 후 다음 문제
                            autoPlayTimer = setTimeout(function() {
                                if (!isAutoPlayMode || isPaused) return;

                                if (currentIndex < displayQuestions.length - 1) {
                                    goNext(true); // 자동재생 모드에서 호출
                                } else {
                                    // 마지막 문항이면 처음으로 돌아가기
                                    currentIndex = 0;
                                    renderCurrentQuestion(false);
                                    showToast('처음부터 다시 시작합니다.');
                                }
                                setTimeout(startAutoPlay, 800);
                            }, 2000);
                        });
                    }, 500);
                }, 3000);
            });
        }

        function stopAutoPlay() {
            isAutoPlayMode = false;
            isPaused = false;
            if (autoPlayTimer) {
                clearTimeout(autoPlayTimer);
                autoPlayTimer = null;
            }
            stopAllSpeech();
            releaseWakeLock(); // Wake Lock 해제
            stopKeepAliveAudio(); // 무음 오디오 중지

            var autoplayBtn = document.getElementById('autoplayBtn');
            if (autoplayBtn) {
                autoplayBtn.classList.remove('active-autoplay');
            }

            var pauseContainer = document.getElementById('pauseContainer');
            if (pauseContainer) {
                pauseContainer.style.display = 'none';
            }
        }

        function toggleAutoPlay() {
            isAutoPlayMode = !isAutoPlayMode;

            var autoplayBtn = document.getElementById('autoplayBtn');
            var pauseContainer = document.getElementById('pauseContainer');

            if (isAutoPlayMode) {
                if (autoplayBtn) autoplayBtn.classList.add('active-autoplay');
                if (pauseContainer) pauseContainer.style.display = 'flex';
                isPaused = false;
                updatePauseButton();
                requestWakeLock(); // Wake Lock 활성화
                startKeepAliveAudio(); // 무음 오디오 시작 (화면 꺼짐 방지)
                showToast('자동 재생 시작 (화면 꺼짐 방지 활성화)');
                startAutoPlay();
            } else {
                if (autoplayBtn) autoplayBtn.classList.remove('active-autoplay');
                if (pauseContainer) pauseContainer.style.display = 'none';
                stopAutoPlay();
                showToast('자동 재생 정지');
            }
        }

        function togglePause() {
            if (!isAutoPlayMode) return;

            isPaused = !isPaused;

            if (isPaused) {
                // 일시정지
                if (autoPlayTimer) {
                    clearTimeout(autoPlayTimer);
                    autoPlayTimer = null;
                }
                stopAllSpeech();
                stopKeepAliveAudio(); // 무음 오디오도 일시정지
                showToast('일시정지');
            } else {
                // 재개
                startKeepAliveAudio(); // 무음 오디오 재개
                showToast('재생 재개');
                startAutoPlay();
            }

            updatePauseButton();
        }

        function updatePauseButton() {
            var pauseBtn = document.getElementById('pauseBtn');
            if (!pauseBtn) return;

            if (isPaused) {
                pauseBtn.textContent = '▶️ Resume';
                pauseBtn.classList.add('paused');
            } else {
                pauseBtn.textContent = '⏸ Pause';
                pauseBtn.classList.remove('paused');
            }
        }

        // ========== 음성 인식 기능 ==========

        function initSpeechRecognition() {
            try {
                var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    console.log('Speech Recognition not supported');
                    return false;
                }

                recognition = new SpeechRecognition();
                recognition.lang = 'en-US';

                // iOS 감지
                var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

                // iOS에서는 continuous를 false로 설정해야 더 안정적
                recognition.continuous = !isIOS;
                recognition.interimResults = !isIOS;  // iOS에서는 interimResults도 false로
                recognition.maxAlternatives = 1;

                console.log('iOS detected:', isIOS);

                recognition.onstart = function() {
                    isListening = true;
                    finalTranscript = '';
                    var micBtn = document.getElementById('micBtn');
                    var statusEl = document.getElementById('recognitionStatus');

                    console.log('Recognition started successfully');

                    if (micBtn) {
                        micBtn.classList.add('listening');
                        micBtn.textContent = '🔴 듣는 중... (말씀하세요)';
                    }
                    if (statusEl) {
                        statusEl.textContent = 'Listening...';
                        statusEl.classList.add('active');
                    }
                };

                recognition.onresult = function(event) {
                    console.log('Recognition result received:', event.results.length);

                    var interimTranscript = '';

                    // 모든 결과를 순회하여 최종 결과와 중간 결과 분리
                    for (var i = event.resultIndex; i < event.results.length; i++) {
                        var transcript = event.results[i][0].transcript;
                        console.log('Result', i, ':', transcript, 'isFinal:', event.results[i].isFinal);

                        if (event.results[i].isFinal) {
                            finalTranscript += transcript + ' ';
                        } else {
                            interimTranscript += transcript;
                        }
                    }

                    // 상태 표시 업데이트 (사용자가 말한 내용 표시)
                    var statusEl = document.getElementById('recognitionStatus');
                    if (statusEl) {
                        var displayText = (finalTranscript + interimTranscript).trim();
                        if (displayText.length > 0) {
                            statusEl.textContent = '"' + displayText + '"';
                        }
                    }

                    // iOS에서는 continuous가 false이므로 침묵 타이머를 더 짧게
                    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

                    // 침묵 타이머 리셋 - 말을 할 때마다 타이머 초기화
                    if (silenceTimer) {
                        clearTimeout(silenceTimer);
                    }

                    // iOS는 자동으로 빨리 종료되므로 타이머를 더 짧게 설정
                    var silenceDelay = isIOS ? 1000 : 1500;
                    silenceTimer = setTimeout(function() {
                        if (recognition && isListening) {
                            recognition.stop();
                        }
                    }, silenceDelay);
                };

                recognition.onerror = function(event) {
                    console.error('Recognition error:', event.error, 'message:', event.message || 'no message');

                    // no-speech 에러는 무시 (자연스러운 침묵)
                    if (event.error === 'no-speech') {
                        // 이미 말한 내용이 있으면 처리
                        if (finalTranscript.trim().length > 0) {
                            recognizedText = finalTranscript.trim();
                            checkAnswer(recognizedText);
                        } else {
                            showToast('음성이 감지되지 않았습니다');
                        }
                        stopListening();
                        return;
                    }

                    stopListening();

                    if (event.error === 'not-allowed' || event.error === 'permission-denied') {
                        showToast('마이크 권한이 필요합니다. 설정에서 허용해주세요.');
                    } else if (event.error === 'network') {
                        showToast('네트워크 오류. 인터넷 연결을 확인해주세요.');
                    } else if (event.error === 'service-not-allowed') {
                        showToast('음성 인식 서비스가 차단되었습니다.');
                    } else if (event.error !== 'aborted') {
                        showToast('음성 인식 오류: ' + event.error);
                    }
                };

                recognition.onend = function() {
                    // 최종 결과가 있으면 정답 체크
                    if (finalTranscript.trim().length > 0) {
                        recognizedText = finalTranscript.trim();
                        console.log('Final recognized:', recognizedText);
                        checkAnswer(recognizedText);
                    }

                    stopListening();
                };

                return true;
            } catch (e) {
                console.error('Speech Recognition init error:', e);
                return false;
            }
        }

        function startListening() {
            console.log('startListening called');

            if (!recognition) {
                var initialized = initSpeechRecognition();
                if (!initialized) {
                    showToast('음성 인식을 지원하지 않는 브라우저입니다');
                    return;
                }
            }

            if (isListening) {
                console.log('Already listening, stopping...');
                recognition.stop();
                return;
            }

            // 기존 결과 숨기기
            var resultEl = document.getElementById('answerResult');
            if (resultEl) {
                resultEl.classList.remove('show');
            }

            try {
                recognizedText = '';
                finalTranscript = '';

                // 침묵 타이머 정리
                if (silenceTimer) {
                    clearTimeout(silenceTimer);
                    silenceTimer = null;
                }

                // iOS 디버그 정보
                var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                console.log('Starting recognition on iOS:', isIOS);
                console.log('Recognition settings - continuous:', recognition.continuous, 'interimResults:', recognition.interimResults);

                recognition.start();
                console.log('recognition.start() called');
            } catch (e) {
                console.error('Recognition start error:', e);
                showToast('음성 인식 시작 실패: ' + e.message);
            }
        }

        function stopListening() {
            isListening = false;

            // 침묵 타이머 정리
            if (silenceTimer) {
                clearTimeout(silenceTimer);
                silenceTimer = null;
            }

            var micBtn = document.getElementById('micBtn');
            var statusEl = document.getElementById('recognitionStatus');

            if (micBtn) {
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤 음성으로 답하기';
            }
            if (statusEl) {
                statusEl.textContent = '';
                statusEl.classList.remove('active');
            }
        }

        function normalizeAnswerText(text) {
            // HTML 태그 제거
            text = text.replace(/<[^>]*>/g, ' ');
            // 특수문자 제거
            text = text.replace(/[•\[\]\(\)]/g, ' ');
            // 연속 공백 정리
            text = text.replace(/\s+/g, ' ');
            // 소문자로 변환
            text = text.toLowerCase().trim();
            return text;
        }

        function extractAnswerOptions(answerHtml) {
            // <br> 또는 줄바꿈으로 분리
            var lines = answerHtml.split(/<br\s*\/?>|\n/i);
            var options = [];

            for (var i = 0; i < lines.length; i++) {
                var line = normalizeAnswerText(lines[i]);
                if (line.length > 0) {
                    options.push(line);
                }
            }

            return options;
        }

        function checkAnswerMatch(userText, correctOptions) {
            userText = normalizeAnswerText(userText);

            // 각 정답 옵션에 대해 체크
            for (var i = 0; i < correctOptions.length; i++) {
                var option = correctOptions[i];

                // 핵심 키워드 추출 (3글자 이상 단어)
                var keywords = option.split(' ').filter(function(word) {
                    return word.length >= 3;
                });

                // 키워드가 하나라도 있으면 체크
                if (keywords.length > 0) {
                    var matchCount = 0;
                    for (var k = 0; k < keywords.length; k++) {
                        if (userText.indexOf(keywords[k]) !== -1) {
                            matchCount++;
                        }
                    }

                    // 키워드의 50% 이상 매칭되면 정답
                    if (matchCount / keywords.length >= 0.5) {
                        return true;
                    }
                } else {
                    // 키워드가 없으면 직접 비교
                    if (userText.indexOf(option) !== -1 || option.indexOf(userText) !== -1) {
                        return true;
                    }
                }
            }

            return false;
        }

        function checkAnswer(userAnswer) {
            if (!displayQuestions || displayQuestions.length === 0) return;
            var current = displayQuestions[currentIndex];
            if (!current) return;

            var correctOptions = extractAnswerOptions(current.answer);
            var isCorrect = checkAnswerMatch(userAnswer, correctOptions);

            displayAnswerResult(userAnswer, current.answer, isCorrect);
        }

        function displayAnswerResult(userAnswer, correctAnswer, isCorrect) {
            var resultEl = document.getElementById('answerResult');
            if (!resultEl) return;

            var current = displayQuestions[currentIndex];
            if (!current) return;

            var headerClass = isCorrect ? 'correct' : 'incorrect';
            var headerIcon = isCorrect ? '✅' : '❌';
            var headerText = isCorrect ? '정답입니다!' : '다시 생각해보세요';

            var html = '<div class="result-header ' + headerClass + '">' +
                       headerIcon + ' ' + headerText +
                       '</div>' +
                       '<div class="result-label">당신의 답변:</div>' +
                       '<div class="result-text">"' + userAnswer + '"</div>';

            if (!isCorrect) {
                // 오답일 경우 정답 표시
                var cleanAnswer = correctAnswer.replace(/<br\s*\/?>/gi, ', ')
                                              .replace(/<[^>]*>/g, '')
                                              .replace(/[•\[\]\(\)]/g, '');
                html += '<div class="result-label">정답:</div>' +
                        '<div class="result-text">' + cleanAnswer + '</div>';

                // 오답 목록에 자동 추가
                if (wrongQuestionIds.indexOf(current.id) === -1) {
                    wrongQuestionIds.push(current.id);
                    saveWrongIds();
                    showToast('❌ 오답으로 저장되었습니다');
                } else {
                    showToast('다시 시도해보세요');
                }
            } else {
                // 정답이면 오답 목록에서 제거
                var idx = wrongQuestionIds.indexOf(current.id);
                if (idx !== -1) {
                    wrongQuestionIds.splice(idx, 1);
                    saveWrongIds();
                    showToast('🎉 정답! 오답 목록에서 제거되었습니다');
                } else {
                    showToast('🎉 정답입니다!');
                }
            }

            resultEl.innerHTML = html;
            resultEl.className = 'answer-result show ' + (isCorrect ? 'correct' : 'incorrect');

            // 정답 카드도 표시
            document.getElementById('answerCard').classList.add('visible');

            // 통계 업데이트
            updateStatsFooter();
        }

            var darkToggle = document.getElementById('darkToggle');

            if (isDarkMode) {

                if (darkToggle) darkToggle.textContent = '🌙';

        // 검색 기능
        function performSearch(keyword) {
            if (!keyword || keyword.trim().length === 0) {
                document.getElementById('searchResults').classList.remove('show');
                return;
            }

            keyword = keyword.toLowerCase();
            var results = [];

            for (var i = 0; i < questionsData.length; i++) {
                var q = questionsData[i];
                if (q.question.toLowerCase().indexOf(keyword) !== -1 ||
                    q.answer.toLowerCase().indexOf(keyword) !== -1) {
                    results.push(q);
                    if (results.length >= 20) break;
                }
            }

            var resultsEl = document.getElementById('searchResults');
            if (results.length === 0) {
                resultsEl.innerHTML = '<div class="search-result-item"><div class="search-result-q">검색 결과 없음</div></div>';
                resultsEl.classList.add('show');
            } else {
                var html = '';
                for (var i = 0; i < results.length; i++) {
                    var r = results[i];
                    var answerPreview = r.answer.replace(/<br>/g, ', ').substring(0, 60);
                    html += '<div class="search-result-item" data-qid="' + r.id + '">';
                    html += '<div class="search-result-q">Q.' + r.id + ': ' + r.question.substring(0, 60) + '...</div>';
                    html += '<div class="search-result-a">' + answerPreview + '...</div>';
                    html += '</div>';
                }
                resultsEl.innerHTML = html;
                resultsEl.classList.add('show');

                // 검색 결과 클릭 이벤트
                var items = resultsEl.querySelectorAll('.search-result-item');
                for (var i = 0; i < items.length; i++) {
                    items[i].addEventListener('click', function() {
                        var qid = parseInt(this.getAttribute('data-qid'));
                        jumpToQuestion(qid);
                        document.getElementById('searchInput').value = '';
                        document.getElementById('searchResults').classList.remove('show');
                    });
                }
            }
        }

        function jumpToQuestion(qid) {
            for (var i = 0; i < displayQuestions.length; i++) {
                if (displayQuestions[i].id === qid) {
                    currentIndex = i;
                    renderCurrentQuestion(true); // 자동으로 영문 듣기 재생
                    showToast('Q.' + qid + '번으로 이동');
                    return;
                }
            }
            showToast('현재 필터에서 해당 문제를 찾을 수 없습니다.');
        }

        function updateStatsFooter() {
            var totalCount = displayQuestions.length;
            var wrongCount = wrongQuestionIds.length;

            document.getElementById('statTotal').textContent = totalCount;
            document.getElementById('statWrong').textContent = wrongCount;

            if (totalCount === 0) {
                document.getElementById('statCurrent').textContent = "0";
            } else {
                document.getElementById('statCurrent').textContent = (currentIndex + 1);
            }

            var current = displayQuestions[currentIndex];
            var isCurrentWrong = current && wrongQuestionIds.indexOf(current.id) !== -1;

            var wrongBadgeEl = document.getElementById('wrongBadge');
            if (wrongBadgeEl) {
                if (isCurrentWrong) {
                    wrongBadgeEl.classList.add('show');
                } else {
                    wrongBadgeEl.classList.remove('show');
                }
            }

            var wrongToggleBtnEl = document.getElementById('wrongToggleBtn');
            if (wrongToggleBtnEl) {
                if (isCurrentWrong) {
                    wrongToggleBtnEl.classList.add('is-wrong');
                } else {
                    wrongToggleBtnEl.classList.remove('is-wrong');
                }
            }
        }

        function renderCurrentQuestion(autoPlay) {
            try {
                stopAllSpeech();
                // 자동재생 중이 아닐 때만 정지 (자동재생 중에는 계속 진행)
                // stopAutoPlay는 사용자가 수동으로 버튼을 클릭할 때만 호출

                // 음성 인식 결과 초기화
                if (recognition && isListening) {
                    recognition.stop();
                }
                if (silenceTimer) {
                    clearTimeout(silenceTimer);
                    silenceTimer = null;
                }
                var resultEl = document.getElementById('answerResult');
                if (resultEl) {
                    resultEl.classList.remove('show');
                }

                if (!displayQuestions || displayQuestions.length === 0) {
                    document.getElementById('questionNumber').textContent = 'Q.-';
                    document.getElementById('importantBadge').style.display = 'none';
                    var seniorBadgeEl = document.getElementById('seniorBadge');
                    if (seniorBadgeEl) seniorBadgeEl.classList.remove('show');
                    document.getElementById('questionText').innerHTML = '<div class="empty-state"><h3>문항이 없습니다</h3></div>';
                    document.getElementById('answerCard').classList.remove('visible');
                    document.getElementById('noteContainer').innerHTML = '';
                    document.getElementById('progressBar').style.width = '0%';
                    document.getElementById('prevBtn').disabled = true;
                    document.getElementById('nextBtn').disabled = true;
                    document.getElementById('answerBtn').disabled = true;
                    updateStatsFooter();
                    return;
                }

                document.getElementById('answerBtn').disabled = false;

                var current = displayQuestions[currentIndex];
                if (!current) return;

                document.getElementById('questionNumber').textContent = 'Q.' + current.id;
                document.getElementById('importantBadge').style.display = current.important ? 'inline-block' : 'none';

                var seniorBadgeEl = document.getElementById('seniorBadge');
                if (seniorBadgeEl) {
                    if (current.senior) {
                        seniorBadgeEl.classList.add('show');
                    } else {
                        seniorBadgeEl.classList.remove('show');
                    }
                }

                document.getElementById('questionText').textContent = current.question;

                // 정답을 줄별로 분리하여 렌더링
                var answerTextEl = document.getElementById('answerText');
                var answerLines = current.answer.split(/<br\s*\/?>|\n/i);
                var answerHtml = '';

                for (var i = 0; i < answerLines.length; i++) {
                    var line = answerLines[i].trim();
                    if (line.length > 0) {
                        answerHtml += '<div class="answer-line" data-line="' + i + '">' + line + '</div>';
                    }
                }
                answerTextEl.innerHTML = answerHtml;

                // 각 줄에 클릭 이벤트 추가
                var answerLineEls = answerTextEl.querySelectorAll('.answer-line');
                for (var i = 0; i < answerLineEls.length; i++) {
                    answerLineEls[i].addEventListener('click', function() {
                        var lineText = this.textContent;
                        speakSingleAnswerLine(lineText);
                    });
                }

                // 정답 카드는 기본적으로 숨김
                document.getElementById('answerCard').classList.remove('visible');
                document.getElementById('answerBtn').textContent = '🔊 정답 듣기';
                document.getElementById('answerBtn').classList.remove('playing');

                if (current.note) {
                    document.getElementById('noteContainer').innerHTML = '<div class="note-card">📍 ' + current.note + '</div>';
                } else {
                    document.getElementById('noteContainer').innerHTML = '';
                }

                var progressRatio = Math.round(((currentIndex + 1) / displayQuestions.length) * 100);
                document.getElementById('progressBar').style.width = progressRatio + '%';

                document.getElementById('prevBtn').disabled = (currentIndex === 0);
                document.getElementById('nextBtn').disabled = (currentIndex === displayQuestions.length - 1);

                updateStatsFooter();

                // autoPlay 플래그가 true이고 자동재생 모드가 아닐 때 영문 듣기 실행
                // iOS에서 동작하려면 setTimeout 없이 직접 호출해야 함
                if (autoPlay && !isAutoPlayMode) {
                    speakQuestion(current.question);
                }
            } catch (e) {
                console.error("렌더링 오류:", e);
            }
        }

        function toggleWrongForCurrentQuestion() {
            if (!displayQuestions || displayQuestions.length === 0) return;
            var current = displayQuestions[currentIndex];
            if (!current) return;

            var idx = wrongQuestionIds.indexOf(current.id);
            if (idx === -1) {
                wrongQuestionIds.push(current.id);
                showToast('Q.' + current.id + '번 오답 추가');
            } else {
                wrongQuestionIds.splice(idx, 1);
                showToast('Q.' + current.id + '번 오답 해제');

                if (showWrongOnly) {
                    applyFilter(true);
                    return;
                }
            }

            saveWrongIds();
            updateStatsFooter();
        }

        function playQuestionAudio() {
            if (!displayQuestions || displayQuestions.length === 0) return;
            var current = displayQuestions[currentIndex];
            if (current) {
                speakQuestion(current.question);
            }
        }

        function playAnswerAudio() {
            if (!displayQuestions || displayQuestions.length === 0) return;
            var current = displayQuestions[currentIndex];
            if (current) {
                // 정답 듣기 버튼을 클릭하면 정답 카드 표시
                document.getElementById('answerCard').classList.add('visible');
                speakAnswerLines(current.answer);
            }
        }

        function speakSingleAnswerLine(lineText) {
            if (!('speechSynthesis' in window)) {
                showToast('음성 합성을 지원하지 않습니다.');
                return;
            }

            stopAllSpeech();

            var cleanText = lineText.replace(/<[^>]*>?/gm, ' ')
                                   .replace(/[•\[\]\(\)]/g, ' ')
                                   .replace(/\s+/g, ' ')
                                   .trim();

            // 연도 변환 적용
            cleanText = convertYearsToSpeech(cleanText);

            if (!cleanText) return;

            playSingleUtterance(cleanText, function() {
                // 재생 완료
            });
        }

        function goNext(fromAutoPlay) {
            if (currentIndex < displayQuestions.length - 1) {
                currentIndex++;
                renderCurrentQuestion(true); // 자동으로 영문 듣기 재생
            } else {
                showToast('마지막 문제입니다.');
            }
        }

        function goPrev() {
            // 이전 버튼은 항상 자동재생 중단
            if (isAutoPlayMode) {
                stopAutoPlay();
            }

            if (currentIndex > 0) {
                currentIndex--;
                renderCurrentQuestion(true); // 자동으로 영문 듣기 재생
            } else {
                showToast('첫 번째 문제입니다.');
            }
        }

        function shuffleArray(arr) {
            var newArr = arr.slice();
            for (var i = newArr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = newArr[i];
                newArr[i] = newArr[j];
                newArr[j] = temp;
            }
            return newArr;
        }

        function applyFilter(keepPosition) {
            stopAllSpeech();
            stopAutoPlay();

            var pool = questionsData;

            if (showWrongOnly) {
                pool = pool.filter(function(q) {
                    return wrongQuestionIds.indexOf(q.id) !== -1;
                });
            } else if (showSeniorOnly) {
                pool = pool.filter(function(q) { return q.senior; });
            } else if (showImportantOnly) {
                pool = pool.filter(function(q) { return q.important; });
            }

            if (isRandom) {
                displayQuestions = shuffleArray(pool);
            } else {
                displayQuestions = pool.slice();
            }

            if (!keepPosition || currentIndex >= displayQuestions.length) {
                currentIndex = 0;
            }
            renderCurrentQuestion(false); // 필터 적용 시에는 자동 재생하지 않음
        }

        function handleToggleRandom() {
            isRandom = !isRandom;
            document.getElementById('randomBtn').classList.toggle('active', isRandom);
            applyFilter();
            showToast(isRandom ? '랜덤 순서' : '번호 순서');
        }

        function handleToggleImportant() {
            showImportantOnly = !showImportantOnly;
            if (showImportantOnly) {
                showWrongOnly = false;
                showSeniorOnly = false;
                document.getElementById('wrongOnlyBtn').classList.remove('active-wrong');
                document.getElementById('seniorOnlyBtn').classList.remove('active-senior');
            }
            document.getElementById('importantBtn').classList.toggle('active', showImportantOnly);
            applyFilter();
            showToast(showImportantOnly ? '핵심 문항만 표시' : '전체 문항 표시');
        }

        function handleToggleWrongOnly() {
            showWrongOnly = !showWrongOnly;
            if (showWrongOnly) {
                showImportantOnly = false;
                showSeniorOnly = false;
                document.getElementById('importantBtn').classList.remove('active');
                document.getElementById('seniorOnlyBtn').classList.remove('active-senior');
            }
            document.getElementById('wrongOnlyBtn').classList.toggle('active-wrong', showWrongOnly);
            applyFilter();
            showToast(showWrongOnly ? '오답 (' + wrongQuestionIds.length + '개)' : '전체 문항');
        }

        function handleToggleSeniorOnly() {
            showSeniorOnly = !showSeniorOnly;
            if (showSeniorOnly) {
                showImportantOnly = false;
                showWrongOnly = false;
                document.getElementById('importantBtn').classList.remove('active');
                document.getElementById('wrongOnlyBtn').classList.remove('active-wrong');
            }
            document.getElementById('seniorOnlyBtn').classList.toggle('active-senior', showSeniorOnly);
            applyFilter();
            showToast(showSeniorOnly ? '65세 문항만 표시 (20개)' : '전체 문항 표시');
        }

        // 이벤트 바인딩
        document.getElementById('prevBtn').addEventListener('click', goPrev);
        document.getElementById('nextBtn').addEventListener('click', function() {
            // 수동 클릭 시 자동재생 중단
            if (isAutoPlayMode) {
                stopAutoPlay();
            }
            goNext();
        });
        document.getElementById('answerBtn').addEventListener('click', function() {
            // 수동 클릭 시 자동재생 중단
            if (isAutoPlayMode) {
                stopAutoPlay();
            }
            playAnswerAudio();
        });
        document.getElementById('randomBtn').addEventListener('click', handleToggleRandom);
        document.getElementById('importantBtn').addEventListener('click', handleToggleImportant);
        document.getElementById('wrongOnlyBtn').addEventListener('click', handleToggleWrongOnly);
        document.getElementById('seniorOnlyBtn').addEventListener('click', handleToggleSeniorOnly);
        document.getElementById('wrongToggleBtn').addEventListener('click', toggleWrongForCurrentQuestion);
        document.getElementById('autoplayBtn').addEventListener('click', toggleAutoPlay);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('darkToggle').addEventListener('click', toggleDarkMode);

        // 질문 텍스트 클릭 시 다시 듣기
        document.getElementById('questionText').addEventListener('click', function() {
            var cur = displayQuestions[currentIndex];
            if (cur) speakQuestion(cur.question);
        });

        // 검색
        document.getElementById('searchInput').addEventListener('input', function() {
            performSearch(this.value);
        });

        document.getElementById('searchBtn').addEventListener('click', function() {
            var keyword = document.getElementById('searchInput').value;
            performSearch(keyword);
        });

        // 마이크 버튼
        document.getElementById('micBtn').addEventListener('click', function() {
            startListening();
        });

        // 키보드 단축키
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                goNext();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                goPrev();
            } else if (e.key === 'ArrowDown' || e.key === 'Enter') {
                e.preventDefault();
                playAnswerAudio();
            } else if (e.key === 'x' || e.key === 'X') {
                e.preventDefault();
                toggleWrongForCurrentQuestion();
            }
        });

        // 스와이프
        var touchStartX = 0;
        var touchStartY = 0;
        var cardContainer = document.getElementById('cardContainer');

        cardContainer.addEventListener('touchstart', function(e) {
            if (e.touches && e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        cardContainer.addEventListener('touchend', function(e) {
            if (e.changedTouches && e.changedTouches.length === 1) {
                var touchEndX = e.changedTouches[0].clientX;
                var touchEndY = e.changedTouches[0].clientY;
                var diffX = touchEndX - touchStartX;
                var diffY = touchEndY - touchStartY;

                if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
                    // 스와이프로 이동 시 자동재생 중단 (수동 조작)
                    if (isAutoPlayMode) {
                        stopAutoPlay();
                    }

                    if (diffX < 0) {
                        goNext();
                    } else {
                        goPrev();
                    }
                }
            }
        }, { passive: true });

        // 음성 초기화
        try {
            if ('speechSynthesis' in window && window.speechSynthesis) {
                window.speechSynthesis.onvoiceschanged = function() {
                    try { window.speechSynthesis.getVoices(); } catch (e) {}
                };
            }
        } catch (speechErr) {}

        // Wake Lock 관리 - 페이지를 떠날 때 해제
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // 페이지가 백그라운드로 가면 Wake Lock이 자동 해제됨
                // 무음 오디오는 계속 재생되어 백그라운드에서도 실행 유지
            } else if (!document.hidden && isAutoPlayMode && !isPaused) {
                // 포그라운드로 돌아왔을 때 자동 재생 중이면 재요청
                if (wakeLock === null) {
                    requestWakeLock();
                }
                // 무음 오디오가 중단되었으면 다시 시작
                if (keepAliveAudio && keepAliveAudio.paused) {
                    startKeepAliveAudio();
                }
            }
        });

        window.addEventListener('beforeunload', function() {
            releaseWakeLock();
            stopKeepAliveAudio();
        });

        // 초기화
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
            document.getElementById('darkToggle').textContent = '☀️';
        }

        document.getElementById('randomBtn').classList.add('active');
        renderCurrentQuestion(false); // 초기 로드 시에는 자동 재생하지 않음 (iOS 제약)

        // 음성 인식 지원 체크
        (function checkSpeechRecognitionSupport() {
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            var micBtn = document.getElementById('micBtn');

            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                       (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isHTTPS = window.location.protocol === 'https:' || window.location.hostname === 'localhost';

            console.log('=== Speech Recognition Support Check ===');
            console.log('Platform:', navigator.platform);
            console.log('User Agent:', navigator.userAgent);
            console.log('iOS detected:', isIOS);
            console.log('HTTPS:', isHTTPS);
            console.log('SpeechRecognition available:', !!SpeechRecognition);

            if (!SpeechRecognition) {
                if (micBtn) {
                    micBtn.disabled = true;
                    if (isIOS && !isHTTPS) {
                        micBtn.textContent = '🎤 HTTPS 필요';
                        console.log('iOS requires HTTPS for speech recognition');
                    } else {
                        micBtn.textContent = '🎤 음성 인식 미지원';
                    }
                }
                console.log('Speech Recognition not supported in this browser');
            } else {
                console.log('Speech Recognition is available');
                if (isIOS) {
                    console.log('iOS mode: continuous=false, interimResults=false for better compatibility');
                }
            }
        })();
    </script>
</body>
</html>
